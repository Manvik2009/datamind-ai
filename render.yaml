services:
  - type: web
    name: datamind-ai-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: development
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://datamind-ai-platform.web.app
      - key: FRONTEND_URL
        value: https://datamind-ai-platform.web.app
      - key: AI_PROVIDER
        value: mock
      - key: LOG_LEVEL
        value: info
      - key: SUPABASE_URL
        value: https://mock-supabase.supabase.co
      - key: SUPABASE_ANON_KEY
        value: mock-anon-key
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: mock-service-role-key
      - key: JWT_SECRET
        value: mock-jwt-secret-for-development-only-32chars
