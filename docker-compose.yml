version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datamind-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AI_API_KEY=${AI_API_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_MODEL=${AI_MODEL:-gpt-4}
      - PYTHON_SERVICE_URL=http://ml-service:5001
      - CORS_ORIGIN=${FRONTEND_URL:-http://localhost}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
    depends_on:
      ml-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datamind-network
    volumes:
      - uploads:/app/uploads

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - UPLOAD_DIR=/tmp/datamind-uploads
      - MODEL_DIR=/tmp/datamind-models
    restart: unless-stopped
    networks:
      - datamind-network
    volumes:
      - ml-models:/tmp/datamind-models
      - ml-uploads:/tmp/datamind-uploads

networks:
  datamind-network:
    driver: bridge

volumes:
  uploads:
  ml-models:
  ml-uploads:
